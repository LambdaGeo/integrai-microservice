# docker-compose.debug.yml
# Override para desenvolvimento com debug remoto
services:
  users-service:
    command: >
      sh -c "pip install debugpy &&
             python -m debugpy --listen 0.0.0.0:5678 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8003:8000"
      - "5678:5678"
    environment:
      - DEBUG=True

  gestantes-service:
    command: >
      sh -c "pip install debugpy &&
             python -m debugpy --listen 0.0.0.0:5679 -m uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001:8001"
      - "5679:5679"
    environment:
      - DEBUG=True

  avaliacoes-service:
    command: >
      sh -c "pip install debugpy &&
             python -m debugpy --listen 0.0.0.0:5680 -m uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload"
    ports:
      - "8004:8002"
      - "5680:5680"
    environment:
      - DEBUG=True

  django:
    command: ["sh", "-c", "pip install debugpy && python -m debugpy --listen 0.0.0.0:5677 --wait-for-client manage.py runserver 0.0.0.0:8001 --noreload"]
    ports:
      - "8000:8001"
      - "5677:5677"
    environment:
      - DEBUG=True
